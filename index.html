<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVestido — Romaneios</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    /* paleta editorial: nude quente, vinho profundo, tinta */
    --bg:#f5f2ee; --panel:#faf8f5; --card:#ffffff; --sidebar:#20161a;
    --text:#241b1f; --muted:#8c7f83; --faint:#b6abae;
    --sep:#e9e2dc; --line:#eee8e2;
    --accent:#7c2d43;         /* vinho */
    --accent-soft:#f3e4e8;
    --accent-ink:#ffffff;
    --gold:#b08544;
    --ok:#3f7d5a; --ok-soft:#e5efe8;
    --warn:#b7791f; --warn-soft:#f6ecd9;
    --erro:#9e2b25; --erro-soft:#f6e2df;
    --field:#f3efea;
    --side-text:#e9ddd8; --side-muted:#9c8a86; --side-active:#3a2830;
    --shadow:0 1px 2px rgba(45,30,35,.04),0 12px 32px -12px rgba(45,30,35,.16);
    --radius:16px;
  }
  [data-theme="escuro"]{
    color-scheme:dark;
    --bg:#161114; --panel:#1d1619; --card:#211a1d; --sidebar:#0f0a0c;
    --text:#f2e9ec; --muted:#9a8b8f; --faint:#6d6165;
    --sep:#332a2d; --line:#2b2225;
    --accent:#d98aa0; --accent-soft:#3a2830; --accent-ink:#1a1215;
    --gold:#cba25f;
    --ok:#6fbf90; --ok-soft:#213028; --warn:#e0b25a; --warn-soft:#33291a;
    --erro:#e88a83; --erro-soft:#3a2320; --field:#2a2124;
    --side-text:#e9ddd8; --side-muted:#8a7a7e; --side-active:#241a1e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.006em;
  }
  h1,h2,h3,.serif{font-family:"Fraunces",Georgia,serif;}
  .app{display:flex;min-height:100vh}

/* ---------- SIDEBAR ---------- */
.side{
width:238px;flex:0 0 238px;background(--sidebar);color(--side-text);
display;flex-direction;position;top:0;height:100vh;
padding:0;z-index:40;
}
.side .brand{padding:26px 22px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.side .brand img{width:132px;max-width:70%;height;display;filter(0) invert(1);opacity:.96}
.side .brand .tag{font-size:11px;letter-spacing:.14em;text-transform;color(--side-muted);margin-top:12px;font-weight:600}
.side nav{padding:16px 12px;flex:1;overflow-y}
.side .grp{font-size:10.5px;letter-spacing:.13em;text-transform;color(--side-muted);font-weight:700;margin:18px 10px 7px}
.side .grp
.navi{display;align-items;gap:12px;width:100%;text-align;border;background;
color(--side-text);padding:10px 12px;border-radius:11px;cursor;font-size:14.5px;font-weight:500;
font-family;letter-spacing:-.01em;transition .14s,color .14s;margin-bottom:1px}
.navi ion-icon{font-size:19px;color(--side-muted);transition .14s}
.navi{background(255,255,255,.05)}
.navi.on{background(--side-active);color:#fff;font-weight:600}
.navi.on ion-icon{color(--accent)}
.side .who{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07)}
.side .who label{font-size:10.5px;letter-spacing:.1em;text-transform;color(--side-muted);font-weight:700;margin-bottom:6px;display}
.side .who input{width:100%;background(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#fff;
border-radius:10px;padding:9px 11px;font-size:14px;font-family}
.side .who input::placeholder{color(--side-muted)}
.side .themebar{display;gap:7px;padding:12px 16px 18px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.18);cursor;padding:0;transition .15s}
.dot{transform(.9)} .dot.on{border-color:#fff}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;display;flex-direction}
.topbar{display;align-items;gap:12px;padding:12px 16px;background(--sidebar);color:#fff;position;top:0;z-index:30}
.topbar img{height:26px;filter(0) invert(1)}
.burger{background;border;color:#fff;font-size:26px;display;padding:2px;cursor}
.content{max-width:960px;width:100%;margin:0 auto;padding:34px 34px 90px}
.pagehead{margin-bottom:26px}
.pagehead .eyebrow{font-size:11px;letter-spacing:.16em;text-transform;color(--accent);font-weight:700;margin-bottom:8px}
.pagehead h1{font-size:40px;line-height:1.02;font-weight:600;margin:0;letter-spacing:-.02em}
.pagehead p{color(--muted);font-size:15px;margin:9px 0 0;max-width:52ch}

.card{background(--card);border:1px solid var(--line);border-radius(--radius);padding:22px;margin-bottom:18px;box-shadow(--shadow)}
.card h2{font-family:"Inter",sans-serif;font-size:12px;font-weight:700;text-transform;letter-spacing:.09em;color(--muted);margin:0 0 16px}
label{display;font-size:12.5px;color(--muted);margin:14px 0 6px;font-weight:600;letter-spacing:.01em}
input,textarea,select{
width:100%;padding:11px 13px;border:1px solid var(--sep);border-radius:11px;background(--field);
color(--text);font-size:15px;font-family;letter-spacing:-.01em;transition .14s,box-shadow .14s;
}
input::placeholder,textarea::placeholder{color(--faint)}
input,textarea,select{outline;border-color(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize}
select{appearance;background-image("data/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238c7f83' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat;background-position 12px center;padding-right:34px}

.btn{display;align-items;justify-content;gap:8px;
padding:12px 18px;border-radius:12px;border:1px solid transparent;cursor;
font-size:14.5px;font-weight:600;font-family;letter-spacing:-.01em;transition .1s,opacity .12s,background .14s;white-space}
.btn{transform(.98)}
.btn.primary{background(--accent);color(--accent-ink)}
.btn.primary
.btn.tint{background(--accent-soft);color(--accent);border-color}
.btn.ghost{background(--field);color(--text);border-color(--sep)}
.btn.ghost{border-color(--muted)}
.btn.danger{background(--erro);color:#fff}
.btn.block{width:100%}
.btn{opacity:.45;cursor}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn.xs{padding:6px 10px;font-size:12.5px;border-radius:8px}

.row2{display;gap:12px}.row2>*{flex:1;min-width:0}
.rowtop{align-items}

/* ---------- TILES ---------- */
.tiles{display;grid-template-columns:1fr 1fr;gap:14px}
.tile{display;align-items;gap:14px;background(--card);border:1px solid var(--line);border-radius(--radius);
padding:18px;cursor;box-shadow(--shadow);text-align;width:100%;transition .12s,border-color .14s}
.tile{border-color(--accent);transform(-1px)}
.tile{transform(.99)}
.tile .ico{width:42px;height:42px;border-radius:12px;display;align-items;justify-content;font-size:21px;flex:0 0 auto}
.tile .tx{flex:1;min-width:0}
.tile h3{margin:0;font-family:"Inter";font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.tile p{margin:3px 0 0;color(--muted);font-size:12.5px;line-height:1.4}

/* ---------- ROWS / LIST ---------- */
.rows{background(--card);border:1px solid var(--line);border-radius(--radius);box-shadow(--shadow);overflow}
.rw{display;align-items;gap:13px;padding:15px 18px;cursor;border-bottom:1px solid var(--line);background;border-left;border-right;border-top;width:100%;text-align;transition .1s}
.rw
.rw{background(--field)}
.rw .tx{flex:1;min-width:0}
.rw .tt{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space;overflow;text-overflow}
.rw .mt{font-size:12.5px;color(--muted);margin-top:2px}

.chip{display;align-items;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;background(--field);color(--muted);letter-spacing:.01em;text-transform}
.chip.enviado{background(--warn-soft);color(--warn)}
.chip.conferido{background(--ok-soft);color(--ok)}
.chip.divergencia{background(--erro-soft);color(--erro)}

.item{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px;background(--panel)}
.item .tt{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.item .mt{font-size:12.5px;color(--muted);margin-top:3px}

.search{position;margin-bottom:14px}
.search input{padding-left:38px;background(--card)}
.search .mag{position;left:13px;top:50%;transform(-50%);color(--muted)}

.seg{display;background(--field);border-radius:11px;padding:3px;gap:3px;margin-bottom:14px;flex-wrap}
.seg button{flex:1;min-width:70px;border;background;padding:9px;border-radius:8px;font-size:13px;font-weight:600;color(--text);cursor;font-family;transition .12s}
.seg button.on{background(--card);box-shadow:0 1px 3px rgba(0,0,0,.1);color(--accent)}

.datebar{display;gap:12px;align-items}.datebar>div{flex:1}.datebar label{margin-top:0}

.grade{display;grid-template-columns(5,1fr);gap:8px;margin-top:6px}
.gc{border-radius:11px;padding:7px 4px 8px;text-align;background(--field);border:1.5px solid transparent;transition .12s}
.gc.on{border-color(--accent);background(--accent-soft)}
.gc span{display;font-size:10px;font-weight:700;color(--muted);margin-bottom:4px;letter-spacing:.02em}
.gc input{padding:6px 2px;text-align;font-weight:700;font-size:15px;background(--card);border-color(--sep)}
@media(max-width:520px){.grade{grid-template-columns(4,1fr)}}

.wpp{white-space;font-size:12.5px;line-height:1.6;background(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:14px;font-family,"SF Mono",Menlo,monospace}
.aviso{font-size:12.5px;color(--erro);margin-top:8px;font-weight:500}
.empty{text-align;padding:40px 16px;color(--muted)}
.empty .big{font-size:38px;margin-bottom:10px;opacity:.6}
.empty p{font-size:14px;margin:0}
.spin{width:22px;height:22px;border:2.5px solid var(--sep);border-top-color(--accent);border-radius:50%;animation .7s linear infinite;margin:34px auto}
@keyframes sp{to{transform(360deg)}}

/* ---------- DASHBOARD ---------- */
.kpis{display;grid-template-columns(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:720px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background(--card);border:1px solid var(--line);border-radius(--radius);padding:18px;box-shadow(--shadow);position;overflow}
.kpi .k-ico{position;right:14px;top:14px;font-size:20px;opacity:.85}
.kpi .n{font-family:"Fraunces";font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:12px;color(--muted);font-weight:600;margin-top:6px;letter-spacing:.01em}
.kpi .d{font-size:11.5px;color(--faint);margin-top:3px}

.dashgrid{display;grid-template-columns:1.3fr 1fr;gap:18px}
@media(max-width:820px){.dashgrid{grid-template-columns:1fr}}
.bar-row{display;align-items;gap:12px;margin-bottom:12px}
.bar-row .lbl{width:78px;flex:0 0 auto;font-size:13px;color(--muted);font-weight:600}
.bar-track{flex:1;height:9px;background(--field);border-radius:6px;overflow}
.bar-fill{height:100%;border-radius:6px;transition .5s cubic-bezier(.2,.8,.2,1)}
.bar-row .val{width:34px;flex:0 0 auto;text-align;font-weight:700;font-size:13.5px}

.mini{display;align-items;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.mini
.mini .mdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.mini .mtx{flex:1;min-width:0}
.mini .mtt{font-size:13.5px;font-weight:600;white-space;overflow;text-overflow}
.mini .mmt{font-size:11.5px;color(--muted)}

.iconbtn{background;border;cursor;padding:7px;display;align-items;justify-content;border-radius:9px;flex:0 0 auto;transition .12s}
.iconbtn{background(--field)}

/* ---------- OVERLAY / SHEET ---------- */
.overlay{position;inset:0;background(30,18,22,.42);backdrop-filter(3px);-webkit-backdrop-filter(3px);display;align-items;justify-content;z-index:100;padding:16px;animation .18s ease}
.sheet{background(--card);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:440px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);animation .2s ease;max-height:90vh;overflow-y}
.sheet h2{font-family:"Fraunces";font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 8px;text-transform;color(--text)}
.sheet p.desc{font-size:13.5px;color(--muted);margin:0 0 16px;line-height:1.5}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform(.97);opacity:.5}to{transform(1);opacity:1}}

.editinfo{font-size:12px;color(--muted);margin-top:8px;font-weight:500;display;align-items;gap:6px;width:100%}
.editinfo.bloq{color(--erro)}

/* checklist download */
.checklist{max-height:280px;overflow-y;border:1px solid var(--line);border-radius:12px;padding:6px}
.ck{display;align-items;gap:11px;padding:9px 10px;border-radius:9px;cursor;transition .1s}
.ck{background(--field)}
.ck .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--sep);flex:0 0 auto;display;align-items;justify-content;color:#fff;transition .12s}
.ck.on .box{background(--accent);border-color(--accent)}
.ck .cx{flex:1;min-width:0}
.ck .ctt{font-size:13.5px;font-weight:600;white-space;overflow;text-overflow}
.ck .cmt{font-size:11.5px;color(--muted)}

.toast{position;bottom:26px;left:50%;transform(-50%);background(--text);color(--bg);
padding:12px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:120;box-shadow:0 12px 30px rgba(0,0,0,.28)}

/* barra de seleção da lista */
.selbar{display;align-items;gap:12px;flex-wrap;background(--card);border:1px solid var(--line);
border-radius:13px;padding:10px 12px;margin-bottom:12px;box-shadow(--shadow)}
.selbar .selinfo{flex:1;min-width:120px;font-size:13.5px}
.ck2{display;align-items;gap:8px;background;border;cursor;font-family;
font-size:13.5px;font-weight:600;color(--text);padding:4px 2px}
.ck2 .box,.rowcheck{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--sep);flex:0 0 auto;
display;align-items;justify-content;color:#fff;transition .12s;background(--field)}
.ck2.on .box{background(--accent);border-color(--accent)}
.rowcheck{cursor;padding:0}
.rowcheck{border-color(--accent)}
.rowcheck.on{background(--accent);border-color(--accent)}
.rw.selected{background(--accent-soft)}
[data-theme="escuro"] .rw.selected{background(--accent-soft)}

/* avulsos */
.avtexto{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.avmeta{display;align-items;gap:8px;flex-wrap;margin-top:6px}
.avtag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.01em}
.avloc{display;align-items;gap:3px;font-size:12px;color(--muted);font-weight:600}
.avdata{font-size:11.5px;color(--faint)}
.rw.avdone{opacity:.72}

.backdrop{display}
/* ---------- MOBILE ---------- */
@media(max-width:860px){
.side{position;left:0;top:0;transform(-100%);transition .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 60px rgba(0,0,0,.4)}
.side.open{transform(0)}
.topbar{display}
.backdrop.show{display;position;inset:0;background(0,0,0,.4);z-index:35}
.content{padding:22px 18px 90px}
.pagehead h1{font-size:30px}
.tiles{grid-template-columns:1fr}
}
</style>

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ============================================================
COLE AQUI a URL /exec da implantação do Apps Script:
============================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcuG_plmwPuXsOrI5C098Sehl-__nJCHq-9wsxgl_Sl1OedC8_rNUM9u_8x_ZPYQ8QtA/exec";

const LOGO_URL = "https://recursos.qvestido.com.br/i/SVG-diversos/logo.svg";
const GRADE = ["XPP/34","PP/36","P/38","M/40","G/42","GG/44","G1/46","G2/48","G3/50","G4/52"];
const THEMES = [ {id:"claro",cor:"#f5f2ee"}, {id:"escuro",cor:"#20161a"}, {id:"vinho",cor:"#7c2d43"} ];

const MAX_EDICOES = 2;
const JANELA_MS = 486060*1000;

function ion(name,size){ return function(p){ p=p||{}; return <ion-icon name={name} style={{fontSize+"px",...(p.style||{})}} />; }; }
const I = {
chevron: ion("chevron-forward",15), back: ion("chevron-back",20), mag: ion("search-outline",17),
download: ion("download-outline",17), copy: ion("copy-outline",16), edit: ion("create-outline",16),
};

async function api(payload){
if(SCRIPT_URL.indexOf("COLE_A_URL")===0) throw new Error("Falta colar a SCRIPT_URL no topo do arquivo.");
const res = await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body.stringify(payload)});
const data = await res.json();
if(!data.ok) throw new Error(data.erro||"Erro no servidor");
return data;
}

function parseGrade(g){ if(!g) return {}; if(typeof g==="object") return g; try{return JSON.parse(g)||{}}catch(e){return {}} }
function somaGrade(g){ return Object.values(g||{}).reduce((a,b)=>a+(Number(b)||0),0); }
function gradeTexto(g){ const e=Object.entries(g||{}).filter(([_,q])=>Number(q)>0); return e.length? e.map(([t,q])=>${t}:${q}).join(" ") : "—"; }
function fmtData(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return String(v); return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function fmtDia(v){ const d=new Date(v); if(isNaN(d)) return ""; return d.toLocaleDateString("pt-BR"); }
function ymd(v){ const d=new Date(v); if(isNaN(d)) return ""; return d.toISOString().slice(0,10); }

function estadoEdicao(r){
const qtd = Number(r.qtd_edicoes)||0;
const primeira = r.data_primeira_edicao ? new Date(r.data_primeira_edicao) : null;
let dentroJanela = true, restante = 0;
if(primeira && !isNaN(primeira)){ const passou = Date.now()-primeira.getTime(); dentroJanela = passou<JANELA_MS; restante = Math.max(0,JANELA_MS-passou); }
const usadas = dentroJanela ? qtd : 0;
const podeEditar = r.status==="enviado" && usadas < MAX_EDICOES;
return { podeEditar, usadas, restante, dentroJanela, temPrimeira: !!primeira };
}
function fmtRestante(ms){ if(ms<=0) return "0h"; const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000); return h>=1?${h}h${m>0?(" "+m+"min"):""}:${m}min; }

function romaneioWhatsapp(origem,destino,itens){
const cab=ROMANEIO ${origem} → ${destino}\n${new Date().toLocaleDateString("pt-BR")}\n;
const blocos=itens.map(it=>(
*MARCA:* ${it.marca||""}
*NOME DO PRODUTO:* ${it.nome_produto||""}
*CÓDIGO DO PRODUTO:* ${it.codigo_produto||""}
*ENDEREÇO:* ${it.endereco||""}
*QUANTIDADE ENVIADA:* ${gradeTexto(it.grade)} (total ${somaGrade(it.grade)})
)).join("\n\n");
return cab+"\n"+blocos;
}
function statusCor(s){ return s==="conferido"?"var(--ok)"==="divergencia"?"var(--erro)":"var(--warn)"; }

/* ---------------- GRADE INPUT ---------------- */
function GradeInput({grade,onChange}){
const set=(t,v)=>{ const n={...grade}; const q=Math.max(0,Number(v)||0); if(q>0)n[t]=q; else delete n[t]; onChange(n); };
return (
<div className="grade">
{GRADE.map(t=>(
<div className={"gc"+((grade[t]>0)?" on":"")} key={t}>
<span>{t}</span>
<input type="number" min="0" inputMode="numeric" value={grade[t]||""} placeholder="0" onChange={e=>set(t,e.target.value)}/>
</div>
))}
</div>
);
}

/* ---------------- SENHA SHEET ---------------- */
function SenhaSheet({titulo,aviso,confirmLabel,danger,onConfirm,onCancel}){
const [senha,setSenha]=useState(""); const [erro,setErro]=useState(""); const [ocupado,setOcupado]=useState(false);
async function confirmar(){ setOcupado(true); setErro(""); try{ await onConfirm(senha); }catch(e){ setErro(e.message||"Erro"); setOcupado(false); } }
return (
<div className="overlay" onClick={onCancel}>
<div className="sheet" onClick={e=>e.stopPropagation()}>
<h2>{titulo}</h2>
{aviso && <p className="desc">{aviso}</p>}
<input type="password" value={senha} autoFocus placeholder="Senha"
onChange={e=>{setSenha(e.target.value);setErro("");}} onKeyDown={e=>{if(e.key==="Enter")confirmar();}}/>
{erro && <div className="aviso">{erro}</div>}
<div className="row2" style={{marginTop:16}}>
<button className="btn ghost" onClick={onCancel}>Cancelar</button>
<button className={"btn "+(danger?"danger":"primary")} onClick={confirmar} disabled={ocupado}>{ocupado?"…":(confirmLabel||"Confirmar")}</button>
</div>
</div>
</div>
);
}

/* ---------------- EDITAR ITEM (modal) ---------------- */
function EditItemSheet({item,onSave,onCancel,flash}){
const [f,setF]=useState({...ITEM_VAZIO,...item,grade:{...(item.grade||{})}});
const [buscando,setBuscando]=useState(false);
async function puxar(){
if(!f.link||!f.link.trim())return;
setBuscando(true);
try{ const {dados}=await api({action:"parseLink",url.link.trim()});
setF(v=>({...v,marca.marca||v.marca,nome_produto.nome_produto||v.nome_produto,codigo_produto.codigo_produto||v.codigo_produto}));
flash&&flash("Dados puxados ✨");
}catch(e){flash&&flash("Não rolou: "+e.message);}
setBuscando(false);
}
function salvar(){
if(!f.nome_produto.trim() && !f.codigo_produto.trim()){flash&&flash("Preenche nome ou código.");return;}
if(somaGrade(f.grade)===0){flash&&flash("Preenche a quantidade de 1 tamanho.");return;}
onSave(f);
}
return (
<div className="overlay" onClick={onCancel}>
<div className="sheet" onClick={e=>e.stopPropagation()} style={{maxWidth:480}}>

<ItemForm valor={f} onChange={setF} onPuxar={puxar} buscando={buscando}/>
<div className="row2" style={{marginTop:18}}>
<button className="btn ghost" onClick={onCancel}>Cancelar</button>
<button className="btn primary" onClick={salvar}>Salvar peça</button>
</div>
</div>
</div>
);
}

/* ---------------- SELETOR DE PLANILHAS (download) ---------------- */
function DownloadSheet({romaneios,preSel,onCancel,flash}){
const [sel,setSel]=useState(()=> (preSel&&preSel.length)? new Set(preSel) : new Set(romaneios.map(r=>r.id)));
const [modo,setModo]=useState("detalhado"); // detalhado = item a item; resumo = 1 linha por romaneio
const [gerando,setGerando]=useState(false);
const toggle=(id)=>setSel(s=>{const n=new Set(s); n.has(id)?n.delete(id).add(id); return n;});
const todos=()=>setSel(new Set(romaneios.map(r=>r.id)));
const nenhum=()=>setSel(new Set());

async function baixar(){
const escolhidos=romaneios.filter(r=>sel.has(r.id));
if(!escolhidos.length){flash("Selecione ao menos 1 romaneio.");return;}
setGerando(true);
try{
if(modo==="resumo"){
const linhas=escolhidos.map(r=>({
Romaneio.id, Data(r.data_criacao), Sentido:${r.origem} → ${r.destino},
Status.status, Enviou.criado_por||"", Conferiu.conferido_por||"", Observações.observacoes||"",
}));
const ws=XLSX.utils.json_to_sheet(linhas);
const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Resumo");
XLSX.writeFile(wb,romaneios-resumo_${ymd(new Date())}.xlsx);
} else {
const wb=XLSX.utils.book_new();
const geral=[];
for(const r of escolhidos){
const {romaneio}=await api({action:"getRomaneio",id.id});
const linhas=(romaneio.itens||[]).map(it=>({
Marca.marca, Produto.nome_produto, Codigo.codigo_produto, Endereco.endereco,
"Grade enviada"(parseGrade(it.grade_enviada)), "Total env"(parseGrade(it.grade_enviada)),
"Grade conferida"(parseGrade(it.grade_conferida)), "Total conf"(parseGrade(it.grade_conferida)),
"Situação".status_item, Obs.observacao_item,
}));
linhas.forEach(l=>geral.push({Romaneio.id, Data(r.data_criacao), Sentido:${r.origem} → ${r.destino}, Status.status, ...l}));
// uma aba por romaneio (nome da aba limitado a 31 chars)
if(escolhidos.length<=15 && linhas.length){
const ws=XLSX.utils.json_to_sheet(linhas);
XLSX.utils.book_append_sheet(wb,ws,String(r.id).slice(0,31));
}
}
if(geral.length){
const wsG=XLSX.utils.json_to_sheet(geral);
// deixa "Todos" como primeira aba
wb.SheetNames.unshift("Todos"); wb.Sheets["Todos"]=wsG;
}
if(!wb.SheetNames.length){flash("Nada pra exportar.");setGerando(false);return;}
XLSX.writeFile(wb,romaneios_${ymd(new Date())}.xlsx);
}
flash(Planilha baixada — ${escolhidos.length} romaneio(s) 📊);
onCancel();
}catch(e){flash("Erro ao exportar: "+e.message);}
setGerando(false);
}

return (
<div className="overlay" onClick={onCancel}>
<div className="sheet" onClick={e=>e.stopPropagation()} style={{maxWidth:500}}>
<h2>Baixar planilha</h2>
<p className="desc">Escolha quais romaneios entram no arquivo e o formato.</p>

    <label style={{marginTop:0}}>Formato</label>
    <div className="seg" style={{marginBottom:14}}>
      <button className={modo==="detalhado"?"on":""} onClick={()=>setModo("detalhado")}>Detalhado (item a item)</button>
      <button className={modo==="resumo"?"on":""} onClick={()=>setModo("resumo")}>Resumo (1 linha por romaneio)</button>
    </div>

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
      <label style={{margin:0}}>Romaneios ({sel.size}/{romaneios.length})</label>
      <div style={{display:"flex",gap:6}}>
        <button className="btn ghost xs" onClick={todos}>Todos</button>
        <button className="btn ghost xs" onClick={nenhum}>Nenhum</button>
      </div>
    </div>

    <div className="checklist">
      {romaneios.length===0 && <div className="empty" style={{padding:"22px"}}><p>Nenhum romaneio no filtro atual.</p></div>}
      {romaneios.map(r=>{
        const on=sel.has(r.id);
        return (
          <div className={"ck"+(on?" on":"")} key={r.id} onClick={()=>toggle(r.id)}>
            <div className="box">{on && <ion-icon name="checkmark" style={{fontSize:"14px"}}/>}</div>
            <div className="cx">
              <div className="ctt">{r.id} · {r.origem}→{r.destino}</div>
              <div className="cmt">{fmtDia(r.data_criacao)} · {r.status} · {r.criado_por||"—"}</div>
            </div>
          </div>
        );
      })}
    </div>

    {modo==="detalhado" && sel.size>15 && <div className="aviso" style={{color:"var(--muted)"}}>Mais de 15 selecionados: sai só a aba “Todos” consolidada (sem abas individuais).</div>}

    <div className="row2" style={{marginTop:18}}>
      <button className="btn ghost" onClick={onCancel}>Fechar</button>
      <button className="btn primary" onClick={baixar} disabled={gerando}>{gerando?"Gerando…":<span style={{display:"inline-flex",alignItems:"center",gap:7}}><I.download/> Baixar {sel.size>0?`(${sel.size})`:""}</span>}</button>
    </div>
  </div>
</div>

);
}

const flash=(m)=>{setToast(m);setTimeout(()=>setToast(""),2200);};

function Dashboard({flash,irPara}){

useEffect(()=>{(async()=>{
try{ const {romaneios}=await api({action:"listRomaneios"}); setDados(romaneios); }
catch(e){flash("Erro: "+e.message);setDados([]);}
})();},[]);

const m=useMemo(()=>{
const d=dados||[];
const enviado=d.filter(r=>r.status==="enviado");
const conferido=d.filter(r=>r.status==="conferido");
const div=d.filter(r=>r.status==="divergencia");
const spPe=d.filter(r=>r.origem==="SP").length;
const peSp=d.filter(r=>r.origem==="Petrolina").length;
const seteDias=Date.now()-7864e5;
const recente=d.filter(r=>{const t=new Date(r.data_criacao).getTime();return !isNaN(t)&&t>=seteDias;}).length;
const ultimos=[...d].sort((a,b)=>String(b.data_criacao).localeCompare(String(a.data_criacao))).slice(0,6);
const taxaDiv = d.length? Math.round(div.length/d.length100):0;
return {total.length,enviado,conferido,div,spPe,peSp,recente,ultimos,taxaDiv};
},[dados]);

if(dados===null) return <div><Head eyebrow="Visão geral" titulo="Dashboard" sub="Carregando os números…"/><div className="spin"/></div>;

const maxDir=Math.max(1,m.spPe,m.peSp);
return (
<div>
<Head eyebrow="Visão geral" titulo="Dashboard" sub="Um panorama rápido dos romaneios entre São Paulo e Petrolina."/>

  </div>

/* ---------------- AVULSOS (anotações rápidas) ---------------- */
const AV_LOCAIS = ["Petrolina","SP","Interno","—"];
const AV_TAGS = ["sem cadastro","só Petrolina","só SP","conferir depois","outro"];
function Avulsos({nome,flash}){
const [lista,setLista]=useState(null);
const [texto,setTexto]=useState("");
const [local,setLocal]=useState("Petrolina");
const [tag,setTag]=useState("sem cadastro");
const [qtd,setQtd]=useState("");
const [salvando,setSalvando]=useState(false);
const [filtro,setFiltro]=useState("abertos"); // abertos | feitos | todos
const [del,setDel]=useState(null);

useEffect(()=>{carregar();},[]);
async function carregar(){
setLista(null);
try{ const {avulsos}=await api({action:"listAvulsos"}); setLista(avulsos); }
catch(e){flash("Erro: "+e.message);setLista([]);}
}
async function adicionar(){
if(!texto.trim()){flash("Escreve o que quer anotar.");return;}
setSalvando(true);
try{
await api({action:"addAvulso",texto.trim(),local,tag,quantidade,criado_por});
setTexto("");setQtd("");
flash("Anotado ✍️");
carregar();
}catch(e){flash("Erro: "+e.message);}
setSalvando(false);
}
async function toggle(a){
// atualização otimista
setLista(l=>l.map(x=>x.id===a.id?{...x,feito:!x.feito}));
try{ await api({action:"toggleAvulso",id.id}); }
catch(e){ flash("Erro: "+e.message); carregar(); }
}
async function remover(a){
setDel(null);
setLista(l=>l.filter(x=>x.id!==a.id));
try{ await api({action:"deleteAvulso",id.id}); flash("Removido 🗑️"); }
catch(e){ flash("Erro: "+e.message); carregar(); }
}
async function limparFeitos(){
try{ const {deleted}=await api({action:"limparAvulsosFeitos"}); flash(${deleted||0} concluído(s) limpo(s) 🧹); carregar(); }
catch(e){ flash("Erro: "+e.message); }
}

const filtrada=useMemo(()=>{
const l=lista||[];
if(filtro==="abertos") return l.filter(a=>!a.feito);
if(filtro==="feitos")  return l.filter(a=>a.feito);
return l;
},[lista,filtro]);

const abertos=(lista||[]).filter(a=>!a.feito).length;
const feitos=(lista||[]).filter(a=>a.feito).length;

function tagCor(t){
if(t==="sem cadastro") return {bg:"var(--accent-soft)",fg:"var(--accent)"};
if(t==="só Petrolina") return {bg:"var(--warn-soft)",fg:"var(--warn)"};
if(t==="só SP")        return {bg:"var(--ok-soft)",fg:"var(--ok)"};
return {bg:"var(--field)",fg:"var(--muted)"};
}

return (
<div>
<Head eyebrow="Bloco rápido" titulo="Avulsos" sub="Anote peças soltas, sem cadastro, ou coisas que ficam só entre as lojas. É um bloquinho — não vira romaneio."/>

  <div className="card">
    <h2>Nova anotação</h2>
    <label>O que é?</label>
    <textarea rows="2" value={texto} onChange={e=>setTexto(e.target.value)}
      onKeyDown={e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))adicionar();}}
      placeholder="Ex: 3 vestidos Liz sem etiqueta que ficaram em Petrolina"/>
    <div className="row2">
      <div><label>Onde está / vai</label>

Produto.nome_produto, Codigo.codigo_produto, Marca.marca, Endereco.endereco,

function Historico({nome,flash}){
const [dados,setDados]=useState(null);
const [q,setQ]=useState(""); const [status,setStatus]=useState("todos");
const [de,setDe]=useState(""); const [ate,setAte]=useState("");
const [del,setDel]=useState(null);
const [editando,setEditando]=useState(null);
const [baixar,setBaixar]=useState(false);
const [sel,setSel]=useState(()=>new Set()); // ids marcados na lista

const toggleSel=(id)=>setSel(s=>{const n=new Set(s); n.has(id)?n.delete(id).add(id); return n;});

useEffect(()=>{carregar();},[]);
async function carregar(){
setDados(null);
try{ const {romaneios}=await api({action:"listRomaneios"}); setDados(romaneios); }
catch(e){flash("Erro: "+e.message);setDados([]);}
}
async function confirmarDelete(senha){ await api({action:"deleteRomaneio",id.id,senha}); setDel(null); flash("Romaneio excluído 🗑️"); carregar(); }

async function abrirEdicao(r){
if(r.status!=="enviado"){flash("Só dá pra editar romaneio ainda não conferido.");return;}
try{
const {romaneio}=await api({action:"getRomaneio",id.id});
const itensIniciais=(romaneio.itens||[]).map(it=>({marca.marca||"",nome_produto.nome_produto||"",codigo_produto.codigo_produto||"",endereco.endereco||"",grade(it.grade_enviada),link:""}));
setEditando({id.id,itensIniciais,origem.origem,destino.destino,obs.observacoes||"",usadas:0});
}catch(e){flash("Erro: "+e.message);}
}

const filtrada=useMemo(()=>{
return (dados||[]).filter(r=>{
if(status!=="todos" && String(r.status)!==status) return false;
if(de && ymd(r.data_criacao)<de) return false;
if(ate && ymd(r.data_criacao)>ate) return false;
if(q.trim()){ const s=q.toLowerCase();
if(!(String(r.id).toLowerCase().includes(s)||String(r.criado_por||"").toLowerCase().includes(s)||String(r.origem+"→"+r.destino).toLowerCase().includes(s))) return false; }
return true;
});
},[dados,status,de,ate,q]);

const stats=useMemo(()=>({total.length,conf.filter(r=>r.status==="conferido").length,div.filter(r=>r.status==="divergencia").length,env.filter(r=>r.status==="enviado").length}),[filtrada]);

// seleção considerando só o que está visível no filtro atual
const idsVisiveis=useMemo(()=>filtrada.map(r=>r.id),[filtrada]);
const selVisiveis=useMemo(()=>idsVisiveis.filter(id=>sel.has(id)),[idsVisiveis,sel]);
const todosMarcados=idsVisiveis.length>0 && selVisiveis.length===idsVisiveis.length;
const marcarTodos=()=>setSel(s=>{const n=new Set(s); idsVisiveis.forEach(id=>n.add(id)); return n;});
const limparSel=()=>setSel(s=>{const n=new Set(s); idsVisiveis.forEach(id=>n.delete(id)); return n;});
// romaneios que vão pro download: os selecionados (ou todos do filtro, se nada marcado)
const paraBaixar=useMemo(()=>{
if(selVisiveis.length===0) return filtrada;
const set=new Set(selVisiveis);
return filtrada.filter(r=>set.has(r.id));
},[filtrada,selVisiveis]);

if(editando){
return <EditarRomaneio nome={nome} editar={editando} flash={flash} voltar={()=>setEditando(null)} onEditado={()=>{setEditando(null);carregar();}}/>;
}

return (
<div>
<Head eyebrow="Relatórios" titulo="Histórico" sub="Filtre por status ou data, edite romaneios ainda não conferidos e baixe as planilhas que quiser."/>

  <div className="kpis" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
    <div className="kpi"><div className="n">{stats.total}</div><div className="l">No filtro</div></div>
    <div className="kpi"><div className="n" style={{color:"var(--warn)"}}>{stats.env}</div><div className="l">Enviados</div></div>
    <div className="kpi"><div className="n" style={{color:"var(--ok)"}}>{stats.conf}</div><div className="l">Conferidos</div></div>
    <div className="kpi"><div className="n" style={{color:"var(--erro)"}}>{stats.div}</div><div className="l">Divergências</div></div>
  </div>

  <div className="search"><span className="mag"><I.mag/></span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar código, pessoa ou sentido"/></div>

  <div className="seg">
    {[["todos","Todos"],["enviado","Enviados"],["conferido","Conferidos"],["divergencia","Diverg."]].map(([v,l])=>(
      <button key={v} className={status===v?"on":""} onClick={()=>setStatus(v)}>{l}</button>
    ))}
  </div>

  <div className="card">
    <div className="datebar">
      <div><label>De</label><input type="date" value={de} onChange={e=>setDe(e.target.value)}/></div>
      <div><label>Até</label><input type="date" value={ate} onChange={e=>setAte(e.target.value)}/></div>
    </div>
  </div>

  {/* barra de seleção / ações da lista */}
  {dados && filtrada.length>0 &&
    <div className="selbar">
      <button className={"ck2"+(todosMarcados?" on":"")} onClick={()=>todosMarcados?limparSel():marcarTodos()}>
        <span className="box">{todosMarcados && <ion-icon name="checkmark" style={{fontSize:"13px"}}/>}</span>
        {todosMarcados?"Desmarcar todos":"Marcar todos"}
      </button>
      <div className="selinfo">
        {selVisiveis.length>0
          ? <span><b>{selVisiveis.length}</b> selecionado{selVisiveis.length>1?"s":""}</span>
          : <span style={{color:"var(--muted)"}}>Marque os que quiser, ou baixe todos do filtro</span>}
      </div>
      {selVisiveis.length>0 && <button className="btn ghost sm" onClick={limparSel}>Limpar</button>}
      <button className="btn primary sm" onClick={()=>setBaixar(true)}>
        <I.download/> Baixar {selVisiveis.length>0?`(${selVisiveis.length})`:"tudo"}
      </button>
    </div>}

  {dados===null && <div className="spin"/>}
  {dados && filtrada.length===0 && <div className="empty"><div className="big"><ion-icon name="search-outline"/></div><p>Nenhum romaneio nesse filtro.</p></div>}
  {dados && filtrada.length>0 &&
    <div className="rows">
      {filtrada.map(r=>{
        const marcado=sel.has(r.id);
        return (
        <div className={"rw"+(marcado?" selected":"")} key={r.id} style={{cursor:"default",flexWrap:"wrap"}}>
          <button className={"rowcheck"+(marcado?" on":"")} title="Selecionar" onClick={()=>toggleSel(r.id)}>
            {marcado && <ion-icon name="checkmark" style={{fontSize:"14px"}}/>}
          </button>
          <div className="mdot" style={{background:statusCor(r.status),width:9,height:9,borderRadius:"50%",flex:"0 0 auto"}}/>
          <div className="tx">
            <div className="tt">{r.id} <span style={{fontWeight:500,color:"var(--muted)",fontSize:13}}>· {r.origem}→{r.destino}</span></div>
            <div className="mt">{fmtData(r.data_criacao)} · {r.criado_por||"—"}</div>
          </div>
          <span className={"chip "+r.status}>{r.status}</span>
          {r.status==="enviado" &&
            <button className="iconbtn" title="Editar romaneio" onClick={()=>abrirEdicao(r)}><ion-icon name="create-outline" style={{fontSize:"19px",color:"var(--accent)"}}/></button>}
          <button className="iconbtn" title="Excluir romaneio" onClick={()=>setDel(r)}><ion-icon name="trash-outline" style={{fontSize:"19px",color:"var(--erro)"}}/></button>
        </div>
      );})}
    </div>}

  {baixar && <DownloadSheet romaneios={paraBaixar} preSel={selVisiveis} flash={flash} onCancel={()=>setBaixar(false)}/>}
  {del && <SenhaSheet
    titulo="Excluir romaneio?"
    aviso={`${del.id} · ${del.origem}→${del.destino}. Isso apaga o romaneio e todos os itens dele — não dá pra desfazer.`}
    confirmLabel="Excluir" danger onCancel={()=>setDel(null)} onConfirm={confirmarDelete}/>}
</div>

);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
