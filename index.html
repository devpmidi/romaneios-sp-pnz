<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QVestido — Romaneios</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      color-scheme:light;
      --bg:#f5f2ee; --panel:#faf8f5; --card:#fff; --sidebar:#20161a;
      --text:#241b1f; --muted:#8c7f83; --faint:#b6abae;
      --sep:#e9e2dc; --line:#eee8e2; --accent:#7c2d43;
      --accent-soft:#f3e4e8; --accent-ink:#fff; --gold:#b08544;
      --ok:#3f7d5a; --ok-soft:#e5efe8; --warn:#b7791f; --warn-soft:#f6ecd9;
      --erro:#9e2b25; --erro-soft:#f6e2df; --field:#f3efea;
      --side-text:#e9ddd8; --side-muted:#9c8a86; --side-active:#3a2830;
      --shadow:0 1px 2px rgba(45,30,35,.04),0 12px 32px -12px rgba(45,30,35,.16);
      --radius:16px;
    }
    [data-theme="escuro"]{
      color-scheme:dark;
      --bg:#161114; --panel:#1d1619; --card:#211a1d; --sidebar:#0f0a0c;
      --text:#f2e9ec; --muted:#9a8b8f; --faint:#6d6165;
      --sep:#332a2d; --line:#2b2225; --accent:#d98aa0;
      --accent-soft:#3a2830; --accent-ink:#1a1215; --gold:#cba25f;
      --ok:#6fbf90; --ok-soft:#213028; --warn:#e0b25a; --warn-soft:#33291a;
      --erro:#e88a83; --erro-soft:#3a2320; --field:#2a2124;
      --side-text:#e9ddd8; --side-muted:#8a7a7e; --side-active:#241a1e;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6);
    }
    [data-theme="vinho"]{
      --bg:#f7f0f2; --panel:#fbf7f8; --card:#fff; --sidebar:#4b1728;
      --text:#29171e; --muted:#8d727b; --faint:#bca8ae; --sep:#ead9df; --line:#eee1e5;
      --accent:#8e2949; --accent-soft:#f4dfe7; --field:#f7eef1;
      --side-active:#64233a; --side-text:#f7e9ee; --side-muted:#d5aebc;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--text)}
    body{font-family:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
    h1,h2,h3,.serif{font-family:"Fraunces",Georgia,serif}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .app{display:flex;min-height:100vh}
    .side{width:238px;flex:0 0 238px;background:var(--sidebar);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
    .side .brand{padding:26px 22px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
    .side .brand img{width:132px;max-width:70%;height:auto;display:block;filter:brightness(0) invert(1);opacity:.96}
    .side .brand .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);margin-top:12px;font-weight:600}
    .side nav{padding:16px 12px;flex:1;overflow-y:auto}
    .side .grp{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--side-muted);font-weight:700;margin:18px 10px 7px}
    .navi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--side-text);padding:10px 12px;border-radius:11px;cursor:pointer;font-size:14.5px;font-weight:500;font-family:inherit;letter-spacing:-.01em;transition:.14s;margin-bottom:1px}
    .navi:hover{background:rgba(255,255,255,.05)}
    .navi.on{background:var(--side-active);color:#fff;font-weight:600}
    .navi ion-icon{font-size:19px;color:var(--side-muted)}
    .navi.on ion-icon{color:var(--accent)}
    .side .who{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07)}
    .side .who label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);font-weight:700;margin-bottom:6px;display:block}
    .side .who input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#fff;border-radius:10px;padding:9px 11px;font-size:14px}
    .side .who input::placeholder{color:var(--side-muted)}
    .themebar{display:flex;gap:7px;padding:12px 16px 18px}
    .dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.18);padding:0;transition:.15s}
    .dot.on{border-color:#fff}
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--sidebar);color:#fff;position:sticky;top:0;z-index:30}
    .topbar img{height:26px;width:auto;filter:brightness(0) invert(1)}
    .burger{background:transparent;border:0;color:#fff;font-size:26px;padding:2px}
    .content{max-width:960px;width:100%;margin:0 auto;padding:34px 34px 90px}
    .pagehead{margin-bottom:26px}
    .pagehead .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
    .pagehead h1{font-size:40px;line-height:1.02;font-weight:600;margin:0;letter-spacing:-.02em}
    .pagehead p{color:var(--muted);font-size:15px;margin:9px 0 0;max-width:60ch}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
    .card h2{font-family:"Inter",sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 16px}
    label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;font-weight:600;letter-spacing:.01em}
    input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--sep);border-radius:11px;background:var(--field);color:var(--text);font-size:15px;letter-spacing:-.01em;transition:.14s}
    input:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    textarea{resize:vertical}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid transparent;font-size:14.5px;font-weight:600;letter-spacing:-.01em;transition:.1s;white-space:nowrap}
    .btn.primary{background:var(--accent);color:var(--accent-ink)}
    .btn.tint{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
    .btn.ghost{background:var(--field);color:var(--text);border-color:var(--sep)}
    .btn.danger{background:var(--erro);color:#fff}
    .btn.block{width:100%}
    .btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
    .btn.xs{padding:6px 10px;font-size:12.5px;border-radius:8px}
    .row2{display:flex;gap:12px}.row2>*{flex:1;min-width:0}
    .tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .tile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);text-align:left;width:100%;transition:.12s}
    .tile:hover{border-color:var(--accent);transform:translateY(-1px)}
    .tile .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
    .tile .tx{flex:1;min-width:0}.tile h3{margin:0;font-family:"Inter";font-size:15.5px;font-weight:700}.tile p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.4}
    .rows{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .rw{display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;transition:.1s;color:var(--text)}
    .rw:last-child{border-bottom:0}.rw:hover{background:var(--field)}.rw.selected{background:var(--accent-soft)}
    .rw .tx{flex:1;min-width:0}.rw .tt{font-size:15px;font-weight:600;letter-spacing:-.01em}.rw .mt{font-size:12.5px;color:var(--muted);margin-top:2px}
    .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--field);color:var(--muted);letter-spacing:.01em;text-transform:capitalize;white-space:nowrap}
    .chip.enviado{background:var(--warn-soft);color:var(--warn)}.chip.conferido{background:var(--ok-soft);color:var(--ok)}.chip.divergencia{background:var(--erro-soft);color:var(--erro)}
    .item{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px;background:var(--panel)}
    .item .tt{font-weight:600;font-size:14.5px}.item .mt{font-size:12.5px;color:var(--muted);margin-top:3px}
    .search{position:relative;margin-bottom:14px}.search input{padding-left:38px;background:var(--card)}.search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
    .seg{display:flex;background:var(--field);border-radius:11px;padding:3px;gap:3px;margin-bottom:14px;flex-wrap:wrap}
    .seg button{flex:1;min-width:70px;border:0;background:transparent;padding:9px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
    .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1);color:var(--accent)}
    .datebar{display:flex;gap:12px;align-items:flex-end}.datebar>div{flex:1}.datebar label{margin-top:0}
    .grade{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
    .gc{border-radius:11px;padding:7px 4px 8px;text-align:center;background:var(--field);border:1.5px solid transparent}
    .gc.on{border-color:var(--accent);background:var(--accent-soft)}.gc span{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px}
    .gc input{padding:6px 2px;text-align:center;font-weight:700;font-size:15px;background:var(--card);border-color:var(--sep)}
    .wpp{white-space:pre-wrap;font-size:12.5px;line-height:1.6;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:14px;font-family:"SF Mono",Menlo,monospace}
    .aviso{font-size:12.5px;color:var(--erro);margin-top:8px;font-weight:500}
    .empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty .big{font-size:38px;margin-bottom:10px;opacity:.6}.empty p{font-size:14px;margin:0}
    .spin{width:22px;height:22px;border:2.5px solid var(--sep);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:34px auto}
    @keyframes sp{to{transform:rotate(360deg)}}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .kpi .k-ico{position:absolute;right:14px;top:14px;font-size:20px;opacity:.85}.kpi .n{font-family:"Fraunces";font-size:34px;font-weight:600;line-height:1}.kpi .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:6px}.kpi .d{font-size:11.5px;color:var(--faint);margin-top:3px}
    .dashgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
    .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}.bar-row .lbl{width:78px;flex:0 0 auto;font-size:13px;color:var(--muted);font-weight:600}.bar-track{flex:1;height:9px;background:var(--field);border-radius:6px;overflow:hidden}.bar-fill{height:100%;border-radius:6px}.bar-row .val{width:34px;flex:0 0 auto;text-align:right;font-weight:700;font-size:13.5px}
    .mini{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.mini:last-child{border-bottom:0}.mini .mdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}.mini .mtx{flex:1;min-width:0}.mini .mtt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini .mmt{font-size:11.5px;color:var(--muted)}
    .iconbtn{background:transparent;border:0;cursor:pointer;padding:7px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;flex:0 0 auto;color:var(--text)}.iconbtn:hover{background:var(--field)}
    .overlay{position:fixed;inset:0;background:rgba(30,18,22,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
    .sheet{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:440px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto}
    .sheet h2{font-family:"Fraunces";font-size:21px;font-weight:600;margin:0 0 8px}.sheet p.desc{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.5}
    .checklist{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:6px}.ck{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer}.ck:hover{background:var(--field)}.ck .box,.rowcheck{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--sep);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--field)}.ck.on .box,.rowcheck.on{background:var(--accent);border-color:var(--accent)}.ck .cx{flex:1;min-width:0}.ck .ctt{font-size:13.5px;font-weight:600}.ck .cmt{font-size:11.5px;color:var(--muted)}
    .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:120;box-shadow:0 12px 30px rgba(0,0,0,.28)}
    .selbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
    .selbar .selinfo{flex:1;min-width:120px;font-size:13.5px}.ck2{display:flex;align-items:center;gap:8px;background:transparent;border:0;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);padding:4px 2px}
    .avtexto{font-size:14.5px;font-weight:600;line-height:1.35}.avmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}.avtag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}.avloc{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:600}.avdata{font-size:11.5px;color:var(--faint)}.rw.avdone{opacity:.72}
    .backdrop{display:none}

    @media(max-width:860px){
      .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.24s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 60px rgba(0,0,0,.4)}
      .side.open{transform:translateX(0)}.topbar{display:flex}.backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
      .content{padding:22px 18px 90px}.pagehead h1{font-size:30px}.tiles{grid-template-columns:1fr}
    }
    @media(max-width:720px){.kpis{grid-template-columns:1fr 1fr}.dashgrid{grid-template-columns:1fr}.row2{flex-wrap:wrap}.row2>*{min-width:180px}.grade{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:520px){.grade{grid-template-columns:repeat(3,1fr)}.datebar{flex-direction:column;align-items:stretch}.datebar>div{width:100%}}
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const {useState,useEffect,useMemo}=React;

    const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxcuG_plmwPuXsOrI5C098Sehl-__nJCHq-9wsxgl_Sl1OedC8_rNUM9u_8x_ZPYQ8QtA/exec";
    const LOGO_URL="https://recursos.qvestido.com.br/i/SVG-diversos/logo.svg";
    const GRADE=["Tamanho Único","XPP/34","PP/36","P/38","M/40","G/42","GG/44","G1/46","G2/48","G3/50","G4/52"];
    const THEMES=[
      {id:"claro",cor:"#f5f2ee"},
      {id:"escuro",cor:"#20161a"},
      {id:"vinho",cor:"#7c2d43"}
    ];
    const MAX_EDICOES=2;
    const JANELA_MS=48*60*60*1000;
    const ITEM_VAZIO={marca:"",nome_produto:"",codigo_produto:"",endereco:"",grade:{},link:""};

    function I({name,size=17,style}){return <ion-icon name={name} style={{fontSize:size+"px",...(style||{})}}/>}

    async function api(payload){
      if(!SCRIPT_URL || SCRIPT_URL.indexOf("COLE_A_URL")===0) throw new Error("Falta configurar a SCRIPT_URL.");
      const res=await fetch(SCRIPT_URL,{
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(payload)
      });
      if(!res.ok) throw new Error("Falha na comunicação com o Apps Script.");
      const data=await res.json();
      if(!data.ok) throw new Error(data.erro||"Erro no servidor");
      return data;
    }

    function parseGrade(g){
      if(!g)return {};
      if(typeof g==="object")return g;
      try{return JSON.parse(g)||{}}catch(e){return {}}
    }
    function somaGrade(g){return Object.values(g||{}).reduce((a,b)=>a+(Number(b)||0),0)}
    const DRAFT_PREFIX="qv_romaneio_rascunho_";
    const DRAFT_VERSION=1;
    function draftKey(tipo,rota){
      return DRAFT_PREFIX+tipo+"_"+String(rota.origem||"")+"_"+String(rota.destino||"");
    }
    function loadDraft(tipo,rota){
      try{
        const raw=localStorage.getItem(draftKey(tipo,rota));
        if(!raw)return null;
        const d=JSON.parse(raw);
        return d&&d.version===DRAFT_VERSION?d:null;
      }catch(e){return null}
    }
    function saveDraft(tipo,rota,data){
      try{
        localStorage.setItem(draftKey(tipo,rota),JSON.stringify({
          version:DRAFT_VERSION,savedAt:new Date().toISOString(),...data
        }));
        return true;
      }catch(e){return false}
    }
    function clearDraft(tipo,rota){
      try{localStorage.removeItem(draftKey(tipo,rota))}catch(e){}
    }

    function gradeTexto(g){
      const e=Object.entries(g||{}).filter(([_,q])=>Number(q)>0);
      return e.length?e.map(([t,q])=>`${t}:${q}`).join(" "):"—";
    }
    function fmtData(v){
      if(!v)return "";
      const d=new Date(v);
      if(isNaN(d))return String(v);
      return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
    }
    function fmtDia(v){
      const d=new Date(v);
      return isNaN(d)?"":d.toLocaleDateString("pt-BR");
    }
    function ymd(v){
      const d=new Date(v);
      return isNaN(d)?"":d.toISOString().slice(0,10);
    }
    function estadoEdicao(r){
      const qtd=Number(r.qtd_edicoes)||0;
      const primeira=r.data_primeira_edicao?new Date(r.data_primeira_edicao):null;
      let dentroJanela=true,restante=0;
      if(primeira&&!isNaN(primeira)){
        const passou=Date.now()-primeira.getTime();
        dentroJanela=passou<JANELA_MS;
        restante=Math.max(0,JANELA_MS-passou);
      }
      const usadas=dentroJanela?qtd:0;
      return {podeEditar:r.status==="enviado"&&usadas<MAX_EDICOES,usadas,restante,dentroJanela,temPrimeira:!!primeira};
    }
    function statusCor(s){
      if(s==="conferido")return "var(--ok)";
      if(s==="divergencia")return "var(--erro)";
      return "var(--warn)";
    }
    function romaneioWhatsapp(origem,destino,itens){
      const cab=`ROMANEIO ${origem} → ${destino}\n${new Date().toLocaleDateString("pt-BR")}\n`;
      const blocos=itens.map(it=>(
`*MARCA:* ${it.marca||""}
*NOME DO PRODUTO:* ${it.nome_produto||""}
*CÓDIGO DO PRODUTO:* ${it.codigo_produto||""}
*ENDEREÇO:* ${it.endereco||""}
*QUANTIDADE ENVIADA:* ${gradeTexto(it.grade)} (total ${somaGrade(it.grade)})`
      )).join("\n\n");
      return cab+"\n"+blocos;
    }

    function GradeInput({grade,onChange}){
      const set=(t,v)=>{
        const n={...grade};

    function DownloadSheet({romaneios,preSel,onCancel,flash}){
      const [sel,setSel]=useState(()=>preSel&&preSel.length?new Set(preSel):new Set(romaneios.map(r=>r.id)));
      const [modo,setModo]=useState("detalhado");
      const [gerando,setGerando]=useState(false);
      const toggle=id=>setSel(s=>{const n=new Set(s);if(n.has(id))n.delete(id);else n.add(id);return n});
      const todos=()=>setSel(new Set(romaneios.map(r=>r.id)));

      async function baixar(){
        const escolhidos=romaneios.filter(r=>sel.has(r.id));
        if(!escolhidos.length){flash("Selecione ao menos 1 romaneio.");return}
        setGerando(true);
        try{
          const wb=XLSX.utils.book_new();
          if(modo==="resumo"){
            const linhas=escolhidos.map(r=>({

            XLSX.writeFile(wb,`romaneios-resumo_${ymd(new Date())}.xlsx`);
          }else{

              linhas.forEach(l=>geral.push({Romaneio:r.id,Data:fmtData(r.data_criacao),Sentido:`${r.origem} → ${r.destino}`,Status:r.status,...l}));
              if(escolhidos.length<=15&&linhas.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(linhas),String(r.id).slice(0,31));
            }
            if(geral.length){
              const ws=XLSX.utils.json_to_sheet(geral);
              XLSX.utils.book_append_sheet(wb,ws,"Todos");
              wb.SheetNames=[...wb.SheetNames.filter(x=>x!=="Todos"),"Todos"];
            }

    function Enviar({nome,rota,flash}){
      const draftInicial=useMemo(()=>loadDraft("enviar",rota),[rota.origem,rota.destino]);
      const [itens,setItens]=useState(()=>draftInicial?.itens||[]);
      const [obs,setObs]=useState(()=>draftInicial?.obs||"");
      const [form,setForm]=useState(()=>draftInicial?.form||{...ITEM_VAZIO});
      const [buscando,setBuscando]=useState(false),[enviando,setEnviando]=useState(false),[criado,setCriado]=useState(null),[editIdx,setEditIdx]=useState(null);
      const [autoSalvo,setAutoSalvo]=useState(!!draftInicial);
      const {origem:rOrigem,destino:rDestino}=rota;

      const salvarRascunho=()=>{
        const ok=saveDraft("enviar",rota,{itens,obs,form});
        if(ok){setAutoSalvo(true);flash("Rascunho salvo.");}
        else flash("Não foi possível salvar o rascunho.");
      };

      useEffect(()=>{
        const timer=setTimeout(()=>{
          const temConteudo=itens.length>0||obs.trim()!==""||form.link||form.nome_produto||form.codigo_produto||form.marca||form.endereco||somaGrade(form.grade)>0;
          if(temConteudo){
            saveDraft("enviar",rota,{itens,obs,form});
            setAutoSalvo(true);
          }
        },700);
        return ()=>clearTimeout(timer);
      },[itens,obs,form,rota.origem,rota.destino]);

      async function puxar(){
        if(!form.link.trim())return;
        setBuscando(true);
        try{
          const {dados}=await api({action:"parseLink",url:form.link.trim()});

    function Conferir({nome,rota,flash}){

      const [autoSalvo,setAutoSalvo]=useState(!!draftInicial);
      const chaveItem=(it,i)=>(it&&it.id!=null&&String(it.id).trim()!=="")?"id:"+it.id:"idx:"+i;

      async function carregar(){
        setLista(null);

          const {romaneios}=await api({action:"listRomaneios",status:"enviado",origem:rota.origem,destino:rota.destino});

      }

      useEffect(()=>{
        if(!aberto)return;
        const timer=setTimeout(()=>{
          saveDraft("conferir",rota,{romaneioId:aberto.id,conf});
          setAutoSalvo(true);
        },700);
        return ()=>clearTimeout(timer);
      },[conf,aberto?.id,rota.origem,rota.destino]);

      async function abrir(id){
        try{
          const {romaneio}=await api({action:"getRomaneio",id});
          const draft=loadDraft("conferir",rota);
          const ini={};
          (romaneio.itens||[]).forEach((it,i)=>{

          });

      function relatorio(rom){
        const divs=(rom.itens||[]).filter(it=>it.status_item&&it.status_item!=="ok");
        if(!divs.length)return "Conferido sem divergências ✅";
        const linhas=divs.map(it=>`• ${it.nome_produto} (cód ${it.codigo_produto||"—"})
  enviado:   ${gradeTexto(parseGrade(it.grade_enviada))}
  conferido: ${gradeTexto(parseGrade(it.grade_conferida))}${it.observacao_item?`\n  obs: ${it.observacao_item}`:""}`).join("\n\n");
        return `⚠️ DIVERGÊNCIAS — ${rom.id}\n${rom.origem} → ${rom.destino}\nConferido por ${rom.conferido_por||"—"}\n\n${linhas}`;
      }
      const copiar=t=>{navigator.clipboard?.writeText(t);flash("Copiado!")};

      function baixarConfXlsx(rom){
        const linhas=(rom.itens||[]).map(it=>({
          Produto:it.nome_produto||"",Codigo:it.codigo_produto||"",Marca:it.marca||"",Endereco:it.endereco||"",

            </div>
          </div>
        </div>
      }

      if(aberto)return <div>
        <button className="btn ghost sm" onClick={()=>setAberto(null)} style={{marginBottom:14}}><I name="chevron-back" size={20}/> Romaneios</button>
        <Head eyebrow="Conferência" titulo={`Conferindo ${aberto.id}`} sub={`${aberto.origem} → ${aberto.destino} · por ${aberto.criado_por||"—"} · ${fmtData(aberto.data_criacao)}`}/>
        {(aberto.itens||[]).map((it,i)=>{
          const k=chaveItem(it,i),c=conf[k]||{grade_conferida:{},status_item:"ok",observacao_item:""};
          const gEnv=parseGrade(it.grade_enviada),dif=GRADE.some(t=>(Number(gEnv[t])||0)!==(Number((c.grade_conferida||{})[t])||0));
          return <div className="card" key={k}>
            <div className="item">
              <div className="tt">{it.nome_produto||"(sem nome)"}</div>
              <div className="mt">{it.marca||"—"} · cód {it.codigo_produto||"—"} · end {it.endereco||"—"}</div>
              <div className="mt">enviado: <b>{gradeTexto(gEnv)}</b> · total {somaGrade(gEnv)}</div>
            </div>
            <label>Recebido por tamanho <span style={{color:"var(--accent)"}}>(total {somaGrade(c.grade_conferida)})</span></label>
            <GradeInput grade={c.grade_conferida||{}} onChange={g=>setItem(k,"grade_conferida",g)}/>
            <label>Situação</label>
            <div className="seg">
              <button className={c.status_item==="ok"?"on":""} onClick={()=>setItem(k,"status_item","ok")}>✓ OK</button>
              <button className={c.status_item==="divergencia"?"on":""} onClick={()=>setItem(k,"status_item","divergencia")}>⚠️ Divergência</button>
            </div>
            {dif&&c.status_item==="ok"&&<div className="aviso">Grade diferente da enviada — marque divergência se for o caso.</div>}

          </div>
        })}
        <div className="row2" style={{marginTop:14}}>
          <button className="btn ghost" onClick={salvarRascunho}><I name="save-outline"/> Salvar rascunho</button>
          <button className="btn primary" onClick={finalizar} disabled={salvando}>{salvando?"Salvando…":"Finalizar conferência"}</button>
        </div>
        <div style={{fontSize:11.5,color:"var(--muted)",marginTop:9,textAlign:"right"}}>
          {autoSalvo?"Autosave ativo · conferência salva neste computador":"Autosave aguardando dados…"}
        </div>
      </div>;

      const filtrada=(lista||[]).filter(r=>{
        if(!q.trim())return true;

      });
      return <div>
        <Head eyebrow="Conferência" titulo={`Chegando de ${rota.origem}`} sub={`Romaneios enviados de ${rota.origem} pra ${rota.destino} aguardando conferência.`}/>
        <div className="search"><span className="mag"><I name="search-outline"/></span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por código ou pessoa"/></div>

        <button className="btn ghost block" style={{marginTop:14}} onClick={carregar}>Atualizar</button>
      </div>

    function Historico({nome,flash}){
      const [dados,setDados]=useState(null),[q,setQ]=useState(""),[status,setStatus]=useState("todos"),[de,setDe]=useState(""),[ate,setAte]=useState(""),[del,setDel]=useState(null),[editando,setEditando]=useState(null),[baixar,setBaixar]=useState(false),[sel,setSel]=useState(new Set());

          const itensIniciais=(romaneio.itens||[]).map(it=>({marca:it.marca||"",nome_produto:it.nome_produto||"",codigo_produto:it.codigo_produto||"",endereco:it.endereco||"",grade:parseGrade(it.grade_enviada),link:it.link||""}));

        }catch(e){flash("Erro: "+e.message)}
      }
      const filtrada=useMemo(()=> (dados||[]).filter(r=>{
        if(status!=="todos"&&String(r.status)!==status)return false;
        if(de&&ymd(r.data_criacao)<de)return false;

        return true;
      }),[dados,status,de,ate,q]);
      const stats={total:filtrada.length,conf:filtrada.filter(r=>r.status==="conferido").length,div:filtrada.filter(r=>r.status==="divergencia").length,env:filtrada.filter(r=>r.status==="enviado").length};
      const idsVisiveis=filtrada.map(r=>r.id),selVisiveis=idsVisiveis.filter(id=>sel.has(id)),todosMarcados=idsVisiveis.length>0&&selVisiveis.length===idsVisiveis.length;
      const marcarTodos=()=>setSel(s=>{const n=new Set(s);idsVisiveis.forEach(id=>n.add(id));return n});
      const limparSel=()=>setSel(s=>{const n=new Set(s);idsVisiveis.forEach(id=>n.delete(id));return n});

      return <div><Head eyebrow="Relatórios" titulo="Histórico" sub="Filtre por status ou data, edite romaneios ainda não conferidos e baixe as planilhas que quiser."/>
        <div className="kpis"><div className="kpi"><div className="n">{stats.total}</div><div className="l">No filtro</div></div><div className="kpi"><div className="n" style={{color:"var(--warn)"}}>{stats.env}</div><div className="l">Enviados</div></div><div className="kpi"><div className="n" style={{color:"var(--ok)"}}>{stats.conf}</div><div className="l">Conferidos</div></div><div className="kpi"><div className="n" style={{color:"var(--erro)"}}>{stats.div}</div><div className="l">Divergências</div></div></div>
        <div className="search"><span className="mag"><I name="search-outline"/></span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar código, pessoa ou sentido"/></div>
        <div className="seg">{[["todos","Todos"],["enviado","Enviados"],["conferido","Conferidos"],["divergencia","Diverg."]].map(([v,l])=><button key={v} className={status===v?"on":""} onClick={()=>setStatus(v)}>{l}</button>)}</div>
        <div className="card"><div className="datebar"><div><label>De</label><input type="date" value={de} onChange={e=>setDe(e.target.value)}/></div><div><label>Até</label><input type="date" value={ate} onChange={e=>setAte(e.target.value)}/></div></div></div>
        {dados&&filtrada.length>0&&<div className="selbar"><button className="ck2" onClick={()=>todosMarcados?limparSel():marcarTodos()}><span className={"rowcheck"+(todosMarcados?" on":"")}>{todosMarcados&&<I name="checkmark" size={13}/>}</span>{todosMarcados?"Desmarcar todos":"Marcar todos"}</button><div className="selinfo">{selVisiveis.length?<span><b>{selVisiveis.length}</b> selecionado{selVisiveis.length>1?"s":""}</span>:<span style={{color:"var(--muted)"}}>Marque os que quiser, ou baixe todos do filtro</span>}</div>{selVisiveis.length>0&&<button className="btn ghost sm" onClick={limparSel}>Limpar</button>}<button className="btn primary sm" onClick={()=>setBaixar(true)}><I name="download-outline"/> Baixar {selVisiveis.length?`(${selVisiveis.length})`:"tudo"}</button></div>}
        {dados===null&&<div className="spin"/>}{dados&&filtrada.length===0&&<div className="empty"><div className="big"><I name="search-outline"/></div><p>Nenhum romaneio nesse filtro.</p></div>}
        {dados&&filtrada.length>0&&<div className="rows">{filtrada.map(r=>{const marcado=sel.has(r.id),ed=estadoEdicao(r);return <div className={"rw"+(marcado?" selected":"")} key={r.id} style={{cursor:"default",flexWrap:"wrap"}}><button className={"rowcheck"+(marcado?" on":"")} title="Selecionar" onClick={()=>toggleSel(r.id)}>{marcado&&<I name="checkmark" size={14}/>}</button><div style={{background:statusCor(r.status),width:9,height:9,borderRadius:"50%",flex:"0 0 auto"}}/><div className="tx"><div className="tt">{r.id} <span style={{fontWeight:500,color:"var(--muted)",fontSize:13}}>· {r.origem}→{r.destino}</span></div><div className="mt">{fmtData(r.data_criacao)} · {r.criado_por||"—"}</div></div><span className={"chip "+r.status}>{r.status}</span>{r.status==="enviado"&&<button className="iconbtn" title={ed.podeEditar?"Editar romaneio":"Edição indisponível"} onClick={()=>abrirEdicao(r)}><I name="create-outline" size={19} style={{color:ed.podeEditar?"var(--accent)":"var(--muted)"}}/></button>}<button className="iconbtn" title="Excluir romaneio" onClick={()=>setDel(r)}><I name="trash-outline" size={19} style={{color:"var(--erro)"}}/></button></div>})}</div>}
        {baixar&&<DownloadSheet romaneios={paraBaixar} preSel={selVisiveis} flash={flash} onCancel={()=>setBaixar(false)}/>}
        {del&&<SenhaSheet titulo="Excluir romaneio?" aviso={`${del.id} · ${del.origem}→${del.destino}. Isso apaga o romaneio e todos os itens dele — não dá pra desfazer.`} confirmLabel="Excluir" danger onCancel={()=>setDel(null)} onConfirm={confirmarDelete}/>}
      </div>
    }

    function App(){
      const [theme,setTheme]=useState(localStorage.getItem("qv_theme")||"claro"),[nome,setNome]=useState(localStorage.getItem("qv_nome")||""),[view,setView]=useState("dashboard"),[rota,setRota]=useState({origem:"SP",destino:"Petrolina"}),[toast,setToast]=useState(""),[menuOpen,setMenuOpen]=useState(false);
      useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);localStorage.setItem("qv_theme",theme)},[theme]);
      useEffect(()=>{localStorage.setItem("qv_nome",nome)},[nome]);
      const flash=m=>{setToast(m);setTimeout(()=>setToast(""),2200)},nav=v=>{setView(v);setMenuOpen(false)};
      const NAV=[
        {grp:"Geral",items:[{id:"dashboard",ic:"grid-outline",lb:"Dashboard"},{id:"avulsos",ic:"reader-outline",lb:"Avulsos"},{id:"historico",ic:"albums-outline",lb:"Histórico & relatórios"}]},
        {grp:"São Paulo",items:[{id:"env_sp_pe",ic:"arrow-up-circle-outline",lb:"Enviar pra Petrolina"},{id:"conf_pe_sp",ic:"checkmark-circle-outline",lb:"Conferir de Petrolina"}]},
        {grp:"Petrolina",items:[{id:"env_pe_sp",ic:"arrow-up-circle-outline",lb:"Enviar pra SP"},{id:"conf_sp_pe",ic:"checkmark-circle-outline",lb:"Conferir de SP"}]}
      ];
      function abrir(id){
        if(id==="env_sp_pe"){setRota({origem:"SP",destino:"Petrolina"});nav("enviar")}
        else if(id==="env_pe_sp"){setRota({origem:"Petrolina",destino:"SP"});nav("enviar")}
        else if(id==="conf_pe_sp"){setRota({origem:"Petrolina",destino:"SP"});nav("conferir")}
        else if(id==="conf_sp_pe"){setRota({origem:"SP",destino:"Petrolina"});nav("conferir")}
        else nav(id)
      }
      const activeId=useMemo(()=>{if(view==="enviar")return rota.origem==="SP"?"env_sp_pe":"env_pe_sp";if(view==="conferir")return rota.origem==="Petrolina"?"conf_pe_sp":"conf_sp_pe";return view},[view,rota]);
      return <div className="app">
        <div className={"backdrop"+(menuOpen?" show":"")} onClick={()=>setMenuOpen(false)}/>
        <aside className={"side"+(menuOpen?" open":"")}><div className="brand"><img src={LOGO_URL} alt="QVestido" onError={e=>e.currentTarget.style.display="none"}/><div className="tag">Logística de romaneios</div></div><nav>{NAV.map(g=><div key={g.grp}><div className="grp">{g.grp}</div>{g.items.map(it=><button key={it.id} className={"navi"+(activeId===it.id?" on":"")} onClick={()=>abrir(it.id)}><I name={it.ic} size={19}/> {it.lb}</button>)}</div>)}</nav><div className="who"><label>Quem está usando</label><input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Seu nome"/></div><div className="themebar">{THEMES.map(t=><button key={t.id} className={"dot"+(theme===t.id?" on":"")} title={t.id} style={{background:t.cor}} onClick={()=>setTheme(t.id)}/>)}</div></aside>
        <div className="main"><div className="topbar"><button className="burger" onClick={()=>setMenuOpen(true)}><I name="menu-outline" size={26}/></button><img src={LOGO_URL} alt="QVestido"/></div><div className="content">
          {view==="dashboard"&&<Dashboard flash={flash} irPara={abrir}/>}
          {view==="avulsos"&&<Avulsos nome={nome} flash={flash}/>}
          {view==="enviar"&&<Enviar key={rota.origem+rota.destino} nome={nome} rota={rota} flash={flash}/>}
          {view==="conferir"&&<Conferir key={rota.origem+rota.destino} nome={nome} rota={rota} flash={flash}/>}
          {view==="historico"&&<Historico nome={nome} flash={flash}/>}
        </div></div>
        {toast&&<div className="toast">{toast}</div>}
      </div>
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
